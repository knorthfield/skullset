name: Skullset
options:
  bundleIdPrefix: com.krisnorthfield
  deploymentTarget:
    iOS: "27.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "2"
    DEVELOPMENT_TEAM: UYV646HSVB
    CODE_SIGN_STYLE: Automatic
targets:
  Skullset:
    type: application
    platform: iOS
    sources: [Skullset]
    entitlements:
      path: Skullset/Skullset.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    info:
      path: Skullset/Info.plist
      properties:
        CFBundleDisplayName: Skullset
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSHealthShareUsageDescription: Skullset reads your bodyweight to show it with your chin-ups.
        NSHealthUpdateUsageDescription: Skullset saves your finished workouts to Apple Health.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.krisnorthfield.skullset
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
  SkullsetTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SkullsetTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Skullset
schemes:
  Skullset:
    build:
      targets:
        Skullset: all
    test:
      targets: [SkullsetTests]
